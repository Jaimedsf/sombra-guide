<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sombra Guide · Fortaleza</title>
  <meta name="description" content="Mapa 3D de Fortaleza com a posição do sol e a sombra dos prédios em qualquer data e hora.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='21' cy='11' r='7' fill='%23f2a51a'/%3E%3Crect x='5' y='12' width='8' height='16' fill='%231b1a24'/%3E%3Cpath d='M13 28 L27 28 L13 20 Z' fill='%232b3160' opacity='.5'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#fcfaf6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181720" media="(prefers-color-scheme: dark)">
  <!-- preview when a link is shared in chats and social networks -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Sombra Guide · Fortaleza">
  <meta property="og:description" content="Mapa 3D de Fortaleza com a posição do sol e a sombra dos prédios em qualquer data e hora.">
  <meta property="og:url" content="https://jaimedsf.github.io/sombra-guide/">
  <meta property="og:image" content="https://raw.githubusercontent.com/Jaimedsf/sombra-guide/main/docs/screenshot.png">
  <meta property="og:image:width" content="1400">
  <meta property="og:image:height" content="860">
  <meta property="og:image:alt" content="Sombras dos prédios do Meireles às 16h30 de 21 de dezembro">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div id="map" aria-label="Mapa 3D de Fortaleza com sombras dos prédios"></div>

  <div class="cam" role="group" aria-label="Câmera">
    <button data-cam="rot-left" title="Girar para a esquerda" aria-label="Girar para a esquerda">⟲</button>
    <button data-cam="rot-right" title="Girar para a direita" aria-label="Girar para a direita">⟳</button>
    <button data-cam="tilt-up" title="Inclinar mais (3D)" aria-label="Inclinar mais">▲</button>
    <button data-cam="tilt-down" title="Inclinar menos" aria-label="Inclinar menos">▼</button>
    <button data-cam="top" class="wide" title="Vista de cima, norte para cima" aria-label="2D, vista de cima">2D</button>
    <button data-cam="3d" class="wide" title="Vista 3D inclinada" aria-label="3D, vista inclinada">3D</button>
  </div>

  <aside class="panel" id="panel">
    <header class="head">
      <div>
        <h1>Sombra Guide</h1>
      </div>
      <div class="head-actions">
        <!-- "Compartilhar" on phones; the text changes to confirm a copy -->
        <button class="pill" id="share" type="button" aria-live="polite">Copiar link</button>
        <button class="pill sheet-toggle" id="sheet-toggle" type="button" aria-expanded="false" aria-controls="panel-more">Mais</button>
      </div>
    </header>

    <!-- the results float over the panel below the field instead of pushing it down -->
    <div class="search-box">
      <form class="search" id="search" role="search">
        <input type="search" id="q" placeholder="Digite um endereço em Fortaleza" autocomplete="off" enterkeyhint="search" aria-label="Endereço" aria-describedby="search-status">
        <button class="btn" type="submit">Buscar</button>
      </form>
      <ul class="results" id="results" aria-label="Resultados da busca" hidden></ul>
      <p class="sr-only" id="search-status" role="status"></p>
    </div>

    <section class="readout">
      <svg id="compass" viewBox="-60 -60 120 120" role="img" aria-label="Posição do sol no céu"></svg>
      <div class="big">
        <div class="clock"><span id="clk">--:--</span><span id="mode" class="mode"></span></div>
        <div id="date-label" class="date-label"></div>
        <div id="sun-line" class="sun-line"></div>
        <p id="tz-note" class="tz-note" hidden>Horários no fuso de Fortaleza (UTC−3)</p>
      </div>
    </section>

    <div class="field">
      <label for="time">Hora</label>
      <div class="range">
        <input type="range" id="time" min="0" max="1439" step="1">
        <div class="ends"><span id="t-rise"></span><span id="t-night"></span><span id="t-set"></span></div>
      </div>
    </div>

    <!-- folds away with "Menos" / "Mais": open by default on large screens, folded on phones -->
    <div class="more" id="panel-more">
      <dl class="facts">
        <div><dt>Nascer</dt><dd id="f-rise">--</dd></div>
        <div><dt>Pôr</dt><dd id="f-set">--</dd></div>
        <div><dt>Meio-dia solar</dt><dd id="f-noon">--</dd></div>
        <div><dt>Altura máx.</dt><dd id="f-noonalt">--</dd></div>
      </dl>
      <p class="shadow-note" id="shadow-note"></p>

      <div class="field">
        <label for="doy">Dia do ano</label>
        <input type="range" id="doy" min="0" max="364" step="1">
      </div>

      <div class="row">
        <input type="date" id="date" aria-label="Data">
        <button id="now" class="btn">Agora</button>
        <button id="play-day" class="btn primary" aria-pressed="false">▶ Dia</button>
        <button id="play-year" class="btn" aria-pressed="false">▶ Ano</button>
      </div>
      <div class="row presets" role="group" aria-label="Datas marcantes">
        <button class="chip" data-md="03-11">Sol a pino · mar</button>
        <button class="chip" data-md="03-20">Equinócio · mar</button>
        <button class="chip" data-md="06-21">Solstício · jun</button>
        <button class="chip" data-md="09-22">Equinócio · set</button>
        <button class="chip" data-md="10-02">Sol a pino · out</button>
        <button class="chip" data-md="12-21">Solstício · dez</button>
      </div>
    </div>
  </aside>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
