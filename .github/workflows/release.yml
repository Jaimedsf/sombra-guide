# Attach the built site to each GitHub release, signed with Sigstore (keyless, via the
# workflow's OIDC identity), so users and OpenSSF Scorecard can verify where it came from.
name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and sign, e.g. v1.0.0
        required: true

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # Sigstore keyless signing
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        run: tar -czf "sombra-guide-$TAG.tar.gz" -C dist .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        run: cosign sign-blob --yes --bundle "sombra-guide-$TAG.tar.gz.sigstore" "sombra-guide-$TAG.tar.gz"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "sombra-guide-$TAG.tar.gz" "sombra-guide-$TAG.tar.gz.sigstore" --clobber -R "$GITHUB_REPOSITORY"
